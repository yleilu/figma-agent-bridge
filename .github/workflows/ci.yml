name: ci
on:
  push:
    branches: [dev, main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9 # pinned; keep in lockstep with .bun-version — Bun builds the published bundle
      - run: bun install --frozen-lockfile
      - run: bun run verify

      # The install assertion, packed-tarball form (dev-ops.md §4.2, §4.4). The published form has
      # no meaning here — a branch has nothing on the registry.
      - name: Build the plugin package
        run: bun run build
      - name: Assert the install (packed-tarball form)
        run: bash scripts/assert-install.sh
