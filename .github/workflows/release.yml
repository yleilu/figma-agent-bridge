name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Verify gate
        run: bun run verify
      - name: Build server binaries + .mcpb bundles
        env:
          WORKER_URL: ${{ secrets.FEEDBACK_WORKER_URL }}
        run: bun run build:mcpb
      - name: Build + package the Figma plugin
        run: |
          bun run build:plugin
          ( cd packages/figma-plugin && zip -qr "$GITHUB_WORKSPACE/dist/figma-plugin.zip" manifest.json dist )
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            dist/figma-mcp-*
            dist/*.mcpb
            dist/figma-plugin.zip
